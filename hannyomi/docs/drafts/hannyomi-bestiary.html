<style>
/* 사냥꾼의 도감 노트: 지역별 칸 + 위쪽 고정 동작 선택 (게임과 같은 밤하늘 톤, 단일 테마) */
:root {
  color-scheme: dark;
  --night: #0d1124; --panel: #161c36; --line: #2c355c; --ink: #e9ecf8; --dim: #9aa3c7; --gold: #ffd36a; --leaf: #8fe0a8;
  --display: 'Gowun Batang', 'Batang', serif; --body: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
}
body { background: var(--night); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 48px; }
h1 { font-family: var(--display); color: var(--gold); font-size: clamp(28px, 5vw, 40px); margin: 0; letter-spacing: 2px; text-wrap: balance; }
.sub { color: var(--dim); margin: 6px 0 0; max-width: 64ch; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: rgba(13,17,36,.95); border-bottom: 1px solid var(--line); margin: 18px 0 8px; padding-block: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--night); }
.bar span { color: var(--dim); font-size: 13px; margin-right: 4px; }
.bar button { font-family: var(--body); padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: #1e2546; color: var(--ink); font-weight: 600; cursor: pointer; }
.bar button.on { background: #6b5214; border-color: var(--gold); }
.bar button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
section { margin-top: 22px; }
h2 { font-size: 13px; letter-spacing: 3px; color: var(--leaf); margin: 0 0 10px; font-weight: 800; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.card.boss { border-color: #8a4a3a; }
.card canvas { display: block; width: 100%; height: auto; background: linear-gradient(#26305a, #1a2142 70%, #2a2a3a 70%, #222232); }
.card .t { padding: 8px 10px 10px; }
.card b { display: block; font-size: 14px; }
.card small { color: var(--dim); font-size: 12px; }
.cmp { margin-top: 18px; padding: 14px 16px; border: 1px solid #c58bff; border-radius: 12px; background: #1a1433; }
.cmp .card b em { font-style: normal; color: var(--gold); margin-right: 6px; }
.tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 6px; margin-left: 4px; background: #4a2a24; color: #ffb0a0; vertical-align: 1px; }
</style>
<div class="wrap">
  <h1>한요미 몬스터 도감</h1>
  <p class="sub">1.6 · 1.7 빌드에서 전용 생김새와 움직임을 갖게 된 71종 전부입니다 (1.7.2 천공룡 아우렐리온 추가) (새싹항 섬 ~ 녹스게이트). 게임과 똑같은 그리기 코드로 움직여요. 위에서 동작을 바꿔 볼 수 있어요.</p>
  <div class="bar" role="toolbar" aria-label="동작 선택"><span>동작</span>
    <button type="button" data-mode="idle" class="on">가만히</button><button type="button" data-mode="walk">걷기</button>
    <button type="button" data-mode="atk">공격</button><button type="button" data-mode="hurt">맞기</button><button type="button" data-mode="die">쓰러짐</button>
    <button type="button" data-mode="special">보스 특수 상태</button>
  </div>
  <main id="book"></main>

<script>
(function () {
  G.Game = { player: null, scale: 1 };
  const REG = [
    ['새싹항 섬', ['jelly','crab','spore','capshroom','spikeshell','sealizard','shellock']],
    ['바람결 지방', ['fieldrat','scarecrow','windspirit','wingboar','banditnov','banditarch','barkminion','bark']],
    ['은빛숲 엘렌하임', ['moss_slime','thorn_beetle','cave_spider','web_bat','swamp_toad','firefly_spirit','morwen','rot_fruit']],
    ['광산도시 라그하르트', ['mine_rat','rock_golem','fire_imp','magma_slime','clockwork','drone','foreman','grounder']],
    ['모래바다 사하린', ['sand_lizard','dune_bison','canyon_scorpion','vulture','scorpion_king','mummy','sand_spirit','parakan','mummy_guard']],
    ['얼음성채 프로스트벨', ['snow_wolf','frost_bat','ice_crab','yeti','ice_golem','frost_wraith','frost_giant','kaien_boss','kaien_clone']],
    ['하늘섬 아에로스', ['cloud_sheep','sky_fairy','storm_golem','thunder_bird','star_knight','comet_spirit','storm_guardian','aurelion','eldrick','corrupt_shard']],
    ['녹스게이트', ['void_shade','rift_beast','dark_knight','cult_mage','executor','trial_echo','void_serpent','abyss_eye','nox','void_pillar','hero_echo']],
    ['튜토리얼', ['dummy']],
  ];
  const KIND = { boss: '보스', elite: '정예', minion: '소환', final: '최종 보스' };
  const book = document.getElementById('book'), cards = [];
  for (const [name, ids] of REG) {
    const sec = document.createElement('section');
    sec.innerHTML = `<h2>${name}</h2><div class="grid"></div>`;
    const grid = sec.querySelector('.grid');
    for (const id of ids) {
      const d = G.MONSTERS[id], big = d.kind === 'boss' || d.kind === 'final';
      const c = document.createElement('div'); c.className = 'card' + (big ? ' boss' : '');
      c.innerHTML = `<canvas width="360" height="280" aria-label="${d.name}"></canvas><div class="t"><b>${d.name}${KIND[d.kind] ? `<span class="tag">${KIND[d.kind]}</span>` : ''}</b><small>Lv.${d.lv}${G.MONSKILL && G.MONSKILL[id] ? ' · 스킬: ' + G.MONSKILL[id].map(k => k.name).join(', ') : ''}</small></div>`;
      grid.appendChild(c);
      const m = new G.Monster(id, 0, { x: 0, y: 0, w: 2000 }, null);
      cards.push({ id, m, cv: c.querySelector('canvas'), zoom: Math.min(2.2, 200 / Math.max(d.h * (id === 'aurelion' ? 1.3 : 1), d.w * 0.8)) });
    }
    book.appendChild(sec);
  }
  let mode = 'idle', t0 = performance.now();
  document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
    mode = b.dataset.mode; t0 = performance.now();
    document.querySelectorAll('[data-mode]').forEach(x => x.classList.toggle('on', x === b));
  }));
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame(now) {
    const t = reduce ? 1.3 : now / 1000, el = (now - t0) / 1000;
    for (const C of cards) {
      const ctx = C.cv.getContext('2d'), m = C.m;
      ctx.clearRect(0, 0, 360, 280);
      m.x = 0; m.y = 0; m.dir = 1; m.moving = mode === 'walk'; m.dead = false; m.deadT = 0; m.hurtT = 0; m.atkAnim = -1; m.hot = false; m.groggy = 0;
      if (m.boss) { m.boss.raise = 0; m.boss.guarding = false; m.boss.phase = 0; m.boss.cur = null; }
      if (mode === 'atk') { m.atkAnim = (el * 1.2) % 1; if (m.boss) m.boss.raise = (Math.sin(el * 2) + 1) / 2; if (C.id === 'morwen') m.boss.cur = {}; }
      if (mode === 'hurt') m.hurtT = Math.max(0, 0.12 - (el % 0.8));
      if (mode === 'die') { m.dead = true; m.deadT = el % 1.6; }
      if (mode === 'special' && m.boss) { m.boss.phase = 1; m.boss.guarding = C.id === 'shellock'; m.hot = C.id === 'grounder' && (el % 6) < 3; m.groggy = C.id === 'grounder' && (el % 6) >= 3 ? 1 : 0; }
      ctx.save(); ctx.translate(180, m.flying ? 190 : 230); ctx.scale(C.zoom, C.zoom);
      G.Draw.monster(ctx, m, t + C.id.length);
      ctx.restore();
    }
    if (!reduce) requestAnimationFrame(frame); else setTimeout(() => requestAnimationFrame(frame), 300);
  }
  requestAnimationFrame(frame);
})();
</script>
