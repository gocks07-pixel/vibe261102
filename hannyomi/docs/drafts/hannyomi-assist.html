<title>녹스전 동료 도움 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;600;800&display=swap">
<style>
/* 녹스전 도움 연출 비교: 장면마다 A(컷인 + 실제 등장) / B(컷인만)를 나란히, 같은 시간에 맞춰 반복. 게임과 같은 밤하늘 톤 단일 테마 */
:root {
  color-scheme: dark;
  --night: #0d1124; --panel: #161c36; --line: #2c355c; --ink: #e9ecf8; --dim: #9aa3c7; --gold: #ffd36a; --violet: #c890ff;
  --body: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
}
body { background: var(--night); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; margin: 0; }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 26px 48px; }
h1 { font-size: 22px; margin: 0; color: var(--gold); font-weight: 800; text-wrap: balance; }
.sub { color: var(--dim); margin: 4px 0 0; max-width: 70ch; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 14px 0 0; }
.bar button { font-family: var(--body); padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: #1e2546; color: var(--ink); font-weight: 600; cursor: pointer; }
.bar button.on { background: #6b5214; border-color: var(--gold); }
.bar button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
section { margin-top: 28px; }
h2 { font-size: 17px; margin: 0 0 2px; color: var(--ink); }
h2 em { font-style: normal; color: var(--violet); font-size: 13px; font-weight: 600; margin-left: 8px; }
.desc { color: var(--dim); margin: 0 0 10px; font-size: 13.5px; max-width: 80ch; }
.pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-width: 0; }
.card canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; max-width: 100%; }
.card .t { padding: 8px 12px 11px; }
.card b { display: block; font-size: 14.5px; }
.card b span { display: inline-block; font-size: 12px; padding: 0 7px; border-radius: 6px; margin-right: 6px; background: #3a2e10; color: var(--gold); vertical-align: 1px; }
.card small { color: var(--dim); font-size: 12.5px; display: block; }
</style>
<div class="wrap">
  <h1>녹스전 동료 도움 시안</h1>
  <p class="sub">녹스와 싸울 때 받는 도움 세 가지를 두 가지 방식으로 비교해요. 왼쪽 A는 컷인(얼굴 그림 + 대사)에 동료가 실제로 전장에 나타나는 모습, 오른쪽 B는 컷인만이에요. 두 화면은 같은 시간에 맞춰 7초마다 반복돼요. 게임과 같은 그리기 코드로 그렸어요.</p>
  <div class="bar" role="toolbar" aria-label="재생"><button type="button" id="pause">일시정지</button><button type="button" id="restart">처음부터</button></div>
  <main id="book"></main>
</div>

<script>
(function () {
  const D = G.Draw, PI = Math.PI, L = 7, W = 1280, H = 720, GY = 600;
  const ease = k => 1 - Math.pow(1 - Math.min(1, Math.max(0, k)), 3);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const win = (t, a, b) => t >= a && t < b;
  const HERO = { look: G.LOOKS.toDraw(Object.assign(G.LOOKS.def('f'), { hairStyle: 'pony', hairColor: '#5a3a22', outfit: 'traveler' }), '#f0d060', '#c8a840'),
    gear: G.Outfit.gearFrom(['trial_hat', 'trial_top', 'trial_bottom', 'trial_shoes', 'trial_gloves', 'trial_cape', 'trial_sword']),
    hatColor: '#f0d060', cape: '#8a5ad0', weapon: 'sword', wcolor: '#ffe06a' };
  const ELMA = Object.assign({ skin: '#ffe0c2', gender: 'f' }, G.NPCS.elma.look);
  const KAIEN = Object.assign({ skin: '#f0d0b0' }, G.NPCS.kaien.look);
  const fakeMon = (id, extra) => Object.assign({ x: 0, y: 0, w: G.MONSTERS[id].w, h: G.MONSTERS[id].h, dir: 1, dead: false, deadT: 0, hurtT: 0, atkAnim: -1, aggro: 0, moving: false, hp: 1, maxHp: 1, d: G.MONSTERS[id], id }, extra || {});
  function glow(c, x, y, r, col, a) { const g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)'); c.save(); c.globalAlpha = a; c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); c.restore(); }
  function sparkle(c, x, y, r, col) { c.fillStyle = col; c.beginPath(); for (let i = 0; i < 8; i++) { const a = -PI / 2 + i * PI / 4, rr = i % 2 ? r * 0.3 : r; c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } c.closePath(); c.fill(); }

  // ---------- 전장 ----------
  const STARS = Array.from({ length: 90 }, (_, i) => [(i * 137) % W, (i * 89) % 470, 0.6 + (i % 3) * 0.5, i]);
  function field(c, t) {
    const g = c.createLinearGradient(0, 0, 0, GY); g.addColorStop(0, '#07051a'); g.addColorStop(1, '#2a1640'); c.fillStyle = g; c.fillRect(0, 0, W, GY);
    for (const [x, y, r, i] of STARS) { c.globalAlpha = 0.4 + 0.4 * Math.sin(t * 2 + i); c.fillStyle = '#d8d0ff'; c.fillRect(x, y, r, r); } c.globalAlpha = 1;
    c.fillStyle = '#120c22'; c.fillRect(0, GY, W, H - GY); c.fillStyle = '#3a2a5a'; c.fillRect(0, GY, W, 3);
  }
  function nox(c, t, groggy) {
    c.save(); c.translate(960, GY);
    if (groggy) c.rotate(Math.sin(t * 9) * 0.015);
    D.monster ? null : null;
    const m = fakeMon('nox', { boss: { phase: 2 } }); c.save(); c.scale(-1, 1); G.MonArt.nox.draw(c, m, t, {}); c.restore();
    if (groggy) for (let i = 0; i < 4; i++) { const a = t * 4 + i * PI / 2; sparkle(c, Math.cos(a) * 46, -250 + Math.sin(a) * 10, 9, '#ffe680'); }
    c.restore();
  }
  function hero(c, t, k) {
    const atk = (t * 1.3) % 1.2; D.humanoid(c, Object.assign({ x: 470, y: GY, dir: 1, t, scale: 1.7, atk: atk < 1 ? atk : -1, atkKind: 'melee' }, HERO));
  }
  function hud(c, t, hp, bossHp, shout) {
    c.fillStyle = 'rgba(10,8,16,.85)'; c.beginPath(); c.roundRect(336, 30, 608, 44, 6); c.fill();
    c.font = 'bold 15px "Noto Sans KR", sans-serif'; c.fillStyle = '#ffcf6a'; c.textAlign = 'left'; c.fillText('Lv.100 공허의 군주 녹스  ·  3페이즈', 344, 47);
    c.fillStyle = '#3a1a2a'; c.fillRect(344, 55, 592, 12); c.fillStyle = '#c040ff'; c.fillRect(344, 55, 592 * bossHp, 12);
    c.fillStyle = 'rgba(10,8,16,.85)'; c.fillRect(0, 660, W, 60);
    c.fillStyle = '#5a1a1a'; c.fillRect(200, 676, 300, 16); c.fillStyle = '#e85050'; c.fillRect(200, 676, 300 * hp, 16);
    c.font = 'bold 13px "Noto Sans KR", sans-serif'; c.fillStyle = '#fff'; c.fillText('HP', 172, 689); c.fillText(Math.round(11653 * hp).toLocaleString() + ' / 11,653', 512, 689);
    if (shout) { c.font = 'bold 20px "Noto Sans KR", sans-serif'; c.textAlign = 'center'; c.lineWidth = 5; c.strokeStyle = 'rgba(0,0,0,.8)'; c.strokeText(shout, W / 2, 300); c.fillStyle = '#fff4c0'; c.fillText(shout, W / 2, 300); c.textAlign = 'left'; }
  }

  // ---------- 컷인 (얼굴 그림 + 이름 + 대사) ----------
  function portrait(c, who, cx, cy, r, t) {
    c.save(); c.beginPath(); c.arc(cx, cy, r, 0, 7); c.clip();
    const bg = c.createRadialGradient(cx, cy - 10, 4, cx, cy, r); bg.addColorStop(0, who === 'aurelion' ? '#fff3c8' : '#4a5a9a'); bg.addColorStop(1, who === 'aurelion' ? '#8a7ad8' : '#1a2048'); c.fillStyle = bg; c.fillRect(cx - r, cy - r, r * 2, r * 2);
    if (who === 'aurelion') {
      c.translate(cx - 75 * 1.5 + 6, cy + 150 * 1.5 + 8); c.scale(1.5, 1.5);
      const m = fakeMon('aurelion', { purified: true, soarY: 0 }); G.MonArt.aurelion.draw(c, m, t, { walk: 0, atk: 0, hurt: 0, die: 0, t });
    } else {
      const S = 2.3; D.humanoid(c, { x: cx - 2 * S, y: cy + 50 * S + 14, dir: 1, t, atk: -1, scale: S, look: who === 'elma' ? ELMA : KAIEN });
    }
    c.restore();
    c.strokeStyle = '#ffd36a'; c.lineWidth = 4; c.beginPath(); c.arc(cx, cy, r, 0, 7); c.stroke();
  }
  const CUT = {
    kaien: ['카이엔', '지금이다! 내가 녀석을 붙잡고 있겠다!', '3초 그로기'],
    elma: ['엘마', '포기하지 마세요! 별빛이 당신을 지켜요!', 'HP 50% 회복'],
    aurelion: ['아우렐리온', '지금이다, 여덟 번째 별이여!', '사슬 기둥 하나 파괴'],
  };
  function cutin(c, who, k, t, right) {   // k: 컷인이 떠 있는 동안의 시간 (초), right: 오른쪽에서 들어옴
    const dur = 2.8; if (k < 0 || k > dur) return;
    const inK = ease(k / 0.35), outK = k > dur - 0.35 ? ease((dur - k) / 0.35) : 1, a = Math.min(inK, outK);
    const x = right ? W - 600 + (1 - inK) * 640 : -620 + 640 * inK, y = 96;
    c.save(); c.globalAlpha = a;
    // 비스듬한 띠 배경
    const P = right ? [[x + 40, y], [x + 600, y], [x + 600, y + 120], [x, y + 120]] : [[x, y], [x + 600, y], [x + 560, y + 120], [x, y + 120]];
    c.fillStyle = 'rgba(14,12,34,.92)'; c.beginPath(); P.forEach(([px, py], i) => i ? c.lineTo(px, py) : c.moveTo(px, py)); c.closePath(); c.fill();
    c.strokeStyle = '#ffd36a'; c.lineWidth = 2.5; c.beginPath();
    if (right) { c.moveTo(x + 600, y); c.lineTo(x + 40, y); c.lineTo(x, y + 120); } else { c.moveTo(x, y); c.lineTo(x + 600, y); c.lineTo(x + 560, y + 120); }
    c.stroke();
    for (let i = 0; i < 3; i++) { c.fillStyle = `rgba(255,211,106,${0.25 - i * 0.07})`; const w = 520 - i * 90; c.fillRect(right ? x + 600 - w : x, y + 128 + i * 6, w, 3); }
    const px = right ? x + 510 : x + 90, tx = right ? x + 422 : x + 178;
    portrait(c, who, px, y + 58, 66, t);
    const [name, line, tag] = CUT[who];
    c.textAlign = right ? 'right' : 'left';
    c.font = '30px Jua, "Noto Sans KR", sans-serif'; c.fillStyle = '#ffd36a'; c.fillText(name, tx, y + 44);
    const n = Math.floor(clamp((k - 0.2) / 1.0, 0, 1) * line.length);
    c.font = 'bold 21px "Noto Sans KR", sans-serif'; c.fillStyle = '#ffffff'; c.fillText(line.slice(0, n), tx, y + 80);
    c.font = 'bold 15px "Noto Sans KR", sans-serif'; c.fillStyle = '#9ad8ff'; c.fillText('✦ ' + tag, tx, y + 106);
    c.textAlign = 'left';
    c.restore();
  }

  // ---------- 장면 ----------
  const SCENES = [
    { id: 'kaien', title: '카이엔의 결박', when: '녹스 HP 15%',
      desc: '지금은 대사 한 줄과 함께 녹스가 3초 멈추기만 해요.',
      a: '왼쪽에서 달려 들어와 검을 휘두르면 빛나는 사슬이 녹스를 휘감아요. 3초 동안 사슬을 붙잡고 버티다가, 사슬이 끊어지면 뒤로 뛰어 물러나며 사라져요.',
      b: '컷인이 나오고 녹스 머리 위에 별이 돌며 3초 멈춰요. 카이엔은 화면에 나오지 않아요.',
      draw(c, t, full) {
        field(c, t);
        const grog = win(t, 1.7, 4.7);
        nox(c, t, grog); hero(c, t);
        if (full) {
          let kx = null, pose = -1, alpha = 1, kair = false;
          if (win(t, 0.7, 1.5)) { kx = -60 + ease((t - 0.7) / 0.8) * 760; }
          else if (win(t, 1.5, 4.7)) { kx = 700; pose = t < 1.8 ? (t - 1.5) / 0.3 : -1; }
          else if (win(t, 4.7, 5.6)) { const k = (t - 4.7) / 0.9; kx = 700 - k * 520; alpha = 1 - k; kair = true; }
          if (kx != null) {
            if (win(t, 0.7, 1.5)) for (let i = 1; i < 5; i++) { c.save(); c.globalAlpha = 0.18 * (5 - i) / 4; D.humanoid(c, { x: kx - i * 40, y: GY, dir: 1, t, moving: true, atk: -1, look: KAIEN, scale: 1.7, weapon: 'sword', wcolor: '#8a5aff' }); c.restore(); }
            c.save(); c.globalAlpha = alpha;
            D.humanoid(c, { x: kx, y: GY - (kair ? Math.sin((t - 4.7) / 0.9 * PI) * 70 : 0), dir: kair ? -1 : 1, t, moving: win(t, 0.7, 1.5), air: kair, atk: pose, atkKind: 'melee', look: KAIEN, scale: 1.7, weapon: 'sword', wcolor: '#8a5aff', cape: '#3a2a5a' });
            c.restore();
          }
          if (win(t, 1.6, 4.8)) {   // 사슬
            const k = clamp((t - 1.6) / 0.35, 0, 1), fade = t > 4.6 ? 1 - (t - 4.6) / 0.2 : 1;
            c.save(); c.globalAlpha = fade; c.shadowColor = '#9ad8ff'; c.shadowBlur = 12;
            c.strokeStyle = '#cfe8ff'; c.lineWidth = 3;
            const sx = 728, sy = GY - 52, ex = 900, ey = GY - 130;
            const n = 14; for (let i = 0; i < n * k; i++) { const u = i / n, x = sx + (ex - sx) * u, y = sy + (ey - sy) * u + Math.sin(u * PI) * -18 + Math.sin(t * 20) * 1.2; c.beginPath(); c.ellipse(x, y, 7, 4, i % 2 ? 0.5 : -0.5, 0, 7); c.stroke(); }
            if (k >= 1) for (const [yy, rx] of [[-90, 92], [-150, 84], [-205, 70]]) { c.beginPath(); c.ellipse(960, GY + yy, rx, 16, 0.08, 0, 7); c.setLineDash([12, 7]); c.lineDashOffset = -t * 30; c.stroke(); c.setLineDash([]); }
            c.restore();
          }
          if (win(t, 4.6, 5.0)) for (let i = 0; i < 18; i++) { const a = i * 0.35, r = (t - 4.6) * 600; sparkle(c, 960 + Math.cos(a) * r * 0.5, GY - 150 + Math.sin(a) * r * 0.3, 5, `rgba(207,232,255,${1 - (t - 4.6) / 0.4})`); }
        }
        hud(c, t, 0.62, 0.15, null);
        cutin(c, 'kaien', t - 1.0, t);
      } },
    { id: 'elma', title: '엘마의 회복', when: '3페이즈 시작',
      desc: '지금은 대사 한 줄과 함께 플레이어 몸에 빛기둥이 내려오고 HP가 50% 회복돼요.',
      a: '플레이어 뒤에 별빛이 모이며 엘마가 나타나요. 두 손을 들어 올리면 플레이어에게 빛기둥이 내려와 회복되고, 엘마는 별빛 속으로 사라져요.',
      b: '컷인이 나오고 지금처럼 플레이어 몸에 빛기둥이 내려와 회복돼요. 엘마는 화면에 나오지 않아요.',
      draw(c, t, full) {
        field(c, t); nox(c, t, false);
        const healAt = 2.0, hp = t < healAt ? 0.22 : Math.min(0.72, 0.22 + (t - healAt) * 0.6);
        if (full) {
          let a = 0;
          if (win(t, 0.8, 1.4)) a = (t - 0.8) / 0.6; else if (win(t, 1.4, 3.6)) a = 1; else if (win(t, 3.6, 4.3)) a = 1 - (t - 3.6) / 0.7;
          if (a > 0) {
            glow(c, 300, GY - 60, 110, 'rgba(255,240,180,.9)', 0.45 * a);
            for (let i = 0; i < 10; i++) { const yy = GY - ((t * 60 + i * 37) % 160), xx = 300 + Math.sin(i * 2.1 + t) * 40; sparkle(c, xx, yy, 4, `rgba(255,246,200,${0.8 * a})`); }
            c.save(); c.globalAlpha = a;
            D.humanoid(c, { x: 300, y: GY - (1 - a) * 20, dir: 1, t, atk: win(t, 1.5, 3.4) ? 0.5 : -1, atkKind: 'proj', look: ELMA, scale: 1.7, weapon: 'wand', wcolor: '#fff0a0' });
            c.restore();
            if (win(t, 1.6, 2.1)) { c.save(); c.strokeStyle = 'rgba(255,240,180,.8)'; c.lineWidth = 3; c.setLineDash([6, 8]); c.lineDashOffset = -t * 60; c.beginPath(); c.moveTo(330, GY - 90); c.quadraticCurveTo(400, GY - 200, 470, GY - 160); c.stroke(); c.restore(); }
          }
        }
        hero(c, t);
        if (win(t, healAt, healAt + 1.4)) {   // 빛기둥 + 회복 숫자
          const k = (t - healAt) / 1.4;
          const g = c.createLinearGradient(0, 0, 0, GY); g.addColorStop(0, 'rgba(255,240,160,0)'); g.addColorStop(1, `rgba(255,240,160,${0.7 * (1 - k)})`);
          c.fillStyle = g; c.fillRect(440, 0, 70, GY);
          c.font = 'bold 34px "Noto Sans KR", sans-serif'; c.textAlign = 'center'; c.lineWidth = 5; c.strokeStyle = 'rgba(0,40,0,.8)';
          c.strokeText('+5,826', 476, GY - 150 - k * 60); c.fillStyle = '#8af08a'; c.fillText('+5,826', 476, GY - 150 - k * 60); c.textAlign = 'left';
        }
        hud(c, t, hp, 0.66, null);
        cutin(c, 'elma', t - 1.0, t);
      } },
    { id: 'aurelion', title: '아우렐리온의 별빛 숨결', when: '3페이즈 사슬 기둥 (6장에서 풀어 줬을 때)',
      desc: '지금은 용이 하늘을 가로질러 지나가는 동안 기둥이 부서져요. A는 기둥에 브레스를 직접 쏘는 모습으로 바꾼 시안이에요.',
      a: '하늘에서 날아와 기둥 위에 멈춰 숨을 모은 뒤, 기둥을 향해 별빛 브레스를 직접 쏴서 부숴요. 그다음 하늘 높이 날아가며 퇴장해요.',
      b: '용은 날아오지 않고, 컷인과 함께 하늘에서 빛줄기가 내려와 기둥을 부숴요.',
      draw(c, t, full) {
        field(c, t); nox(c, t, false);
        const broken = t >= 2.2;
        for (const [x, i] of [[200, 0], [640, 1], [1160, 2]]) {
          if (i === 1 && broken) continue;
          c.save(); c.translate(x, GY); const m = fakeMon('void_pillar'); G.MonArt.void_pillar.draw(c, m, t, { walk: 0, atk: 0, hurt: 0, die: 0, t }); c.restore();
        }
        if (full && win(t, 0.8, 3.9)) {   // 날아와 기둥 위에 멈춰 숨결을 쏘고, 하늘로 떠나간다
          let x, y, a = 1;
          if (t < 1.5) { const k = ease((t - 0.8) / 0.7); x = -200 + k * 560; y = 150 + k * 110; a = Math.min(1, (t - 0.8) * 4); }
          else if (t < 2.6) { x = 360; y = 260 + Math.sin(t * 5) * 6; }
          else { const k = (t - 2.6) / 1.3; x = 360 + k * k * 1100; y = 260 - k * 300; a = 1 - Math.max(0, k - 0.6) / 0.4; }
          const fake = fakeMon('aurelion', { purified: true, soarY: 40 });
          c.save(); c.globalAlpha = a; c.translate(x, y); c.scale(0.8, 0.8);
          G.MonArt.aurelion.draw(c, fake, t, { walk: 0, atk: 0, hurt: 0, die: 0, t }); c.restore();
          const mx = x + 100 * 0.8, my = y - 180 * 0.8, tx = 640, ty = GY - 90;   // 입 → 기둥
          if (win(t, 1.5, 1.85)) glow(c, mx, my, 20 + (t - 1.5) * 90, 'rgba(255,246,200,1)', 0.8);   // 숨 모으기
          if (win(t, 1.85, 2.45)) {
            const k = (t - 1.85) / 0.6, reach = Math.min(1, k * 4), ex = mx + (tx - mx) * reach, ey = my + (ty - my) * reach;
            c.save(); c.lineCap = 'round'; c.shadowColor = '#fff0b0'; c.shadowBlur = 30;
            for (const [lw, col] of [[34, 'rgba(255,230,150,.35)'], [18, 'rgba(255,244,200,.8)'], [7, '#ffffff']]) { c.strokeStyle = col; c.lineWidth = Math.max(0.5, lw * (1 - Math.max(0, k - 0.75) * 3)); c.beginPath(); c.moveTo(mx, my); c.lineTo(ex, ey); c.stroke(); }
            c.restore();
            for (let i = 0; i < 6; i++) { const u = ((t * 3 + i / 6) % 1) * reach; sparkle(c, mx + (tx - mx) * u + Math.sin(i * 7 + t * 20) * 10, my + (ty - my) * u + Math.cos(i * 5 + t * 20) * 10, 5, 'rgba(255,255,255,.9)'); }
            if (reach >= 1) glow(c, tx, ty, 70, 'rgba(255,246,200,1)', 0.8);
          }
        }
        if (win(t, 2.2, 2.8)) {
          const k = (t - 2.2) / 0.6;
          c.save(); c.globalAlpha = full ? 0 : 1 - k; c.fillStyle = '#fff6c8'; c.shadowColor = '#fff0b0'; c.shadowBlur = 30; c.fillRect(600, 0, 80, GY); c.restore();
          for (let i = 0; i < 20; i++) { const a = i * 0.31, r = k * 260; sparkle(c, 640 + Math.cos(a) * r, GY - 70 + Math.sin(a) * r * 0.6, 6, `rgba(255,240,176,${1 - k})`); }
        }
        hero(c, t);
        hud(c, t, 0.7, 0.45, t >= 2.2 && t < 4.2 ? '별빛 숨결이 사슬 기둥 하나를 부쉈다!' : null);
        cutin(c, 'aurelion', t - 0.9, t, true);
      } },
  ];

  // ---------- 페이지 ----------
  const book = document.getElementById('book'), views = [];
  for (const sc of SCENES) {
    const s = document.createElement('section');
    const h = document.createElement('h2'); h.textContent = sc.title; const em = document.createElement('em'); em.textContent = sc.when; h.append(em);
    const p = document.createElement('p'); p.className = 'desc'; p.textContent = sc.desc;
    const pair = document.createElement('div'); pair.className = 'pair';
    for (const [full, tag, name, text] of [[true, 'A', '컷인 + 실제 등장', sc.a], [false, 'B', '컷인만', sc.b]]) {
      const card = document.createElement('div'); card.className = 'card';
      const cv = document.createElement('canvas'); cv.width = 960; cv.height = 540; cv.setAttribute('aria-label', `${sc.title} ${tag}: ${name}`);
      const t = document.createElement('div'); t.className = 't';
      const b = document.createElement('b'); const sp = document.createElement('span'); sp.textContent = tag; b.append(sp, name);
      const sm = document.createElement('small'); sm.textContent = text;
      t.append(b, sm); card.append(cv, t); pair.append(card);
      views.push({ cv, sc, full });
    }
    s.append(h, p, pair); book.append(s);
  }
  let paused = false, t0 = performance.now(), pauseAt = 0;
  const btn = document.getElementById('pause');
  btn.addEventListener('click', () => { paused = !paused; btn.textContent = paused ? '재생' : '일시정지'; btn.classList.toggle('on', paused); if (paused) pauseAt = performance.now(); else t0 += performance.now() - pauseAt; });
  document.getElementById('restart').addEventListener('click', () => { t0 = performance.now(); if (paused) pauseAt = t0; });
  function frame(now) {
    const t = (((paused ? pauseAt : now) - t0) / 1000) % L;
    for (const v of views) {
      const r = v.cv.getBoundingClientRect(); if (r.bottom < 0 || r.top > innerHeight) continue;
      const c = v.cv.getContext('2d'); c.setTransform(0.75, 0, 0, 0.75, 0, 0);
      try { v.sc.draw(c, t, v.full); } catch (e) { console.error(e); }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.__setT = (t) => { t0 = performance.now() - t * 1000; paused = true; pauseAt = performance.now(); };
})();
</script>
