<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QA Profile | 전장사업검증</title>
  <meta name="description" content="전장사업검증(SBCM, 램프 제어기) QA 엔지니어 프로필">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="styles.css">
  <script>
    try {
      const t = localStorage.getItem("theme");
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">본문으로 건너뛰기</a>

  <header class="nav">
    <div class="container nav-inner">
      <a class="brand" href="#top" data-bind="name"></a>
      <button class="menu-btn" aria-expanded="false" aria-controls="nav-links" aria-label="메뉴 열기">
        <span></span><span></span><span></span>
      </button>
      <nav id="nav-links" class="nav-links">
        <a href="#about">소개</a>
        <a href="#expertise">전문 분야</a>
        <a href="#process">프로세스</a>
        <a href="#projects">프로젝트</a>
        <a href="#tools">툴</a>
        <a href="#contact">연락처</a>
        <button class="theme-btn" aria-label="다크 모드 전환" title="테마 전환">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main id="main">
    <section id="top" class="hero">
      <div class="container hero-inner">
        <p class="eyebrow" data-bind="title"></p>
        <h1>
          <span data-bind="name"></span>
        </h1>
        <p class="tagline" data-bind="tagline"></p>
        <div class="hero-cta">
          <a class="btn primary" data-bind-href="mailto">연락하기</a>
          <a class="btn ghost" href="#projects">프로젝트 보기</a>
        </div>
      </div>
      <div class="hero-glow" aria-hidden="true"></div>
    </section>

    <section id="about" class="section">
      <div class="container">
        <h2 class="section-title"><span>01</span>소개</h2>
        <div class="about-grid">
          <div id="about-text" class="about-text"></div>
          <ul id="keywords" class="chips" aria-label="주요 역량"></ul>
        </div>
      </div>
    </section>

    <section id="expertise" class="section alt">
      <div class="container">
        <h2 class="section-title"><span>02</span>전문 분야</h2>
        <div id="expertise-list" class="cards three"></div>
      </div>
    </section>

    <section id="process" class="section">
      <div class="container">
        <h2 class="section-title"><span>03</span>검증 프로세스</h2>
        <ol id="process-list" class="process"></ol>
      </div>
    </section>

    <section id="projects" class="section alt">
      <div class="container">
        <h2 class="section-title"><span>04</span>프로젝트</h2>
        <div id="project-list" class="cards two"></div>
      </div>
    </section>

    <section id="tools" class="section">
      <div class="container">
        <h2 class="section-title"><span>05</span>기술 스택 / 툴</h2>
        <div id="tool-list" class="tools"></div>
      </div>
    </section>

    <section id="contact" class="section contact">
      <div class="container contact-inner">
        <h2 class="section-title"><span>06</span>연락처</h2>
        <p class="contact-lead">검증 협업, 프로젝트 문의는 이메일로 연락 주세요.</p>
        <div class="email-box">
          <a class="email" data-bind-href="mailto" data-bind="email"></a>
          <button class="btn ghost copy-btn" type="button">주소 복사</button>
        </div>
        <p class="copy-status" role="status" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">© <span id="year"></span> <span data-bind="name"></span>. All rights reserved.</div>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
